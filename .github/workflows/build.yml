name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: Generate project
        run: ./Scripts/generate.sh
      - name: Build
        run: xcodebuild -scheme Twin -configuration Debug -destination 'platform=macOS' build
      - name: TwinCore tests
        run: swift test
