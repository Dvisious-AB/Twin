name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    # Self-hosted runner on the dev Mac (label: twin): same macOS
    # and environment as real use, no hosted-runner AX quirks.
    # UI tests open real windows on that machine while CI runs.
    runs-on: [self-hosted, twin]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen; brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict
      - name: Generate project
        run: ./Scripts/generate.sh
      - name: Build
        run: xcodebuild -scheme Twin -configuration Debug -destination 'platform=macOS' build
      - name: TwinCore tests
        run: swift test
      - name: UI tests (XCUITest)
        run: xcodebuild -scheme Twin -destination 'platform=macOS' -only-testing:TwinUITests test
