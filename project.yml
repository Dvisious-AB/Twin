name: Twin
options:
  bundleIdPrefix: com.anderselmen
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TwinApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/TwinApp
      - Sources/TwinCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anderselmen.twin
        INFOPLIST_FILE: Sources/TwinApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/TwinApp/Twin.entitlements
    dependencies:
      - target: FinderSyncExtension
    info:
      path: Sources/TwinApp/Info.plist
      properties:
        CFBundleName: Twin
        CFBundleDisplayName: Twin
        CFBundleIdentifier: com.anderselmen.twin
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        CFBundleURLTypes:
          - CFBundleURLName: com.anderselmen.twin
            CFBundleURLSchemes:
              - twin
  FinderSyncExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/FinderSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anderselmen.twin.findersync
        INFOPLIST_FILE: Sources/FinderSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/FinderSync/FinderSync.entitlements
  TwinLite:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/TwinLite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anderselmen.twin.lite
  TwinPro:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/TwinPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anderselmen.twin.pro
schemes:
  Twin:
    build:
      targets:
        TwinApp: all
        FinderSyncExtension: all
        TwinLite: all
        TwinPro: all
    run:
      config: Debug
      executable: TwinApp
    archive:
      config: Release
